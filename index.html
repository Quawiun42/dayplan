function pt(dateStr){
  var d=parse(dateStr), L=S.loc, M=METHODS[L.method]||METHODS.mwl, R=Math.PI/180;
  var tz=-new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTimezoneOffset()/60;
  var D=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)/86400000+2440587.5-2451545.0;
  var fix=function(a,b){a=a%b;return a<0?a+b:a};
  var q=fix(357.529+0.98560028*D,360), mean=fix(280.459+0.98564736*D,360);
  var lon=fix(mean+1.915*Math.sin(q*R)+0.02*Math.sin(2*q*R),360), e=23.439-0.00000036*D;
  var ra=fix(Math.atan2(Math.cos(e*R)*Math.sin(lon*R),Math.cos(lon*R))/R/15,24);
  var eqt=fix(mean/15-ra+12,24)-12;
  var decl=Math.asin(Math.sin(e*R)*Math.sin(lon*R))/R;
  var noon=12+tz-L.lng/15-eqt;
  function ang(a,t,ccw){
    var v=(-Math.sin(a*R)-Math.sin(L.lat*R)*Math.sin(decl*R))/(Math.cos(L.lat*R)*Math.cos(decl*R));
    if(v>1||v<-1)return NaN;
    return t+(ccw?-1:1)*Math.acos(v)/R/15;
  }
  var rise=ang(0.833,noon,true), set=ang(0.833,noon,false);
  var night=fix(rise-set,24);
  var fajr=ang(M[1],noon,true), isha=ang(M[2],noon,false);
  var pf=M[1]/60*night, pi=M[2]/60*night;
  if(isNaN(fajr)||rise-fajr>pf)fajr=rise-pf;
  if(isNaN(isha)||isha-set>pi)isha=set+pi;
  var asr=ang(-Math.atan(1/(L.asr+Math.tan(Math.abs(L.lat-decl)*R)))/R,noon,false);
  var f=function(h){var m=Math.round(fix(h,24)*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  return {fajr:f(fajr),sunrise:f(rise),dhuhr:f(noon+1/60),asr:f(asr),maghrib:f(set),isha:f(isha)};
}

function analyze(note){
  scan.state='busy';scan.msg='';
  var q='Schätze die Kalorien und das Protein des Essens auf dem Foto für die gesamte sichtbare Portion.'+(note?' Hinweis vom Nutzer: '+note:'')+' Antworte nur mit JSON in dieser Form: {"name":"kurzer deutscher Name","kcal":ganze Zahl,"protein":ganze Zahl in Gramm,"kohlenhydrate":ganze Zahl in Gramm,"fett":ganze Zahl in Gramm,"hinweis":"ein kurzer Satz zur Schätzung"}';
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODEL,max_tokens:400,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:scan.img.split(',')[1]}},{type:'text',text:q}]}]})})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||('Fehler '+r.status));return j})})
  .then(function(j){
    var t=(j.content||[]).map(function(c){return c.text||''}).join(''),m=t.match(/\{[\s\S]*\}/);

}

  else if(k==='sleep'){d.sleep={bed:v.bed,wake:v.wake}}
  else if(k==='habit'){S.habits.push({id:uid(),n:v.n.trim()})}
  else if(k==='exam'){S.exams.push({id:uid(),n:v.n.trim(),d:v.d,h:Math.max(0,+v.h||0)})}
  else if(k==='card'){S.cards.push({id:uid(),deck:(v.deck||'').trim(),q:v.q.trim(),a:v.a.trim(),box:1,due:ds(new Date())})}
  else if(k==='note'){S.notes.unshift({id:uid(),n:(v.n||'').trim(),t:v.t.trim(),d:ds(new Date())})}
  else if(k==='sem'){S.sem={cr:Math.max(0,Math.round(+v.cr)||0),grade:Math.min(5,Math.max(0,+v.grade||0))}}
  else if(k==='pname'){S.name=v.name.trim().slice(0,30)}
  else if(k==='apikey'){S.apiKey=v.key.trim()}
  else if(k==='scanmeal'){var sm={id:uid(),n:v.n.trim(),k:+v.k||0,p:+v.p||0,c:+v.c||0,f:+v.f||0,time:nowHM()};d.meals.push(sm);S.recent=[{n:sm.n,k:sm.k,p:sm.p,c:sm.c,f:sm.f}].concat(S.recent.filter(function(r){return r.n!==sm.n})).slice(0,6);scan=null}
  else if(k==='wake'){S.plan.wake=v.wake}
  else if(k==='pmeal'){S.plan.meals.push({id:uid(),n:v.n.trim(),t:v.t})}
  else if(k==='study'){if(+v.m>0)d.study.push({id:uid(),m:Math.round(+v.m),n:(v.n||'').trim()})}
  else if(k==='gymhead'){var g=gymToday();g.name=v.name.trim();g.time=v.time||g.time}
  else if(k==='ex'){gymToday().ex.push({id:uid(),n:v.n.trim(),s:+v.s,r:+v.r,kg:+v.kg||0})}
  else if(k==='task'){S.tasks.push({id:uid(),t:v.t.trim(),due:v.due||'',done:false})}
  else if(k==='class'){S.classes.push({id:uid(),n:v.n.trim(),d:+v.d,a:v.a,b:v.b,room:(v.room||'').trim()})}
  save();render();
});
if(S.startTab&&S.startTab!=='heute'&&(S.tabsOff||[]).indexOf(S.startTab)<0)tab=S.startTab;
if(location.search.indexOf('kompakt')>=0)tab='kompakt';
applyTheme();applyAccent();
(function(){
  var sp=document.getElementById('splash');if(!sp)return;
  if(S.anim===false){sp.remove();return}
  var t=sp.querySelector('b');if(t&&S.name)t.textContent='Hallo, '+S.name;
  var m=document.getElementById('m');m.classList.add('enter');
  sp.addEventListener('click',function(){sp.remove()});
  setTimeout(function(){sp.remove()},1800);setTimeout(function(){m.classList.remove('enter')},2500);
})();
render();
setInterval(notifTick,20000);notifTick();
setInterval(function(){if(!rest)return;var left=Math.ceil((rest.end-Date.now())/1000),el=document.getElementById('rt');if(left<=0){rest=null;beep();if(tab==='gym')render()}else if(el)el.textContent=fmtMS(left)},250);
document.addEventListener('visibilitychange',function(){if(!document.hidden)notifTick()});
setInterval(function(){
  var el=document.getElementById('tm');if(el&&S.timer)el.textContent=fmtClock(Date.now()-S.timer.start);
  if(S.timer&&S.timer.pomo){var x=pomoPhase(Date.now()-S.timer.start),pp=document.getElementById('pp');if(pp)pp.textContent=(x.ph==='work'?'Lernphase':'Pause')+' · noch '+x.left+' Min';if(x.ph!==S.timer.ph){S.timer.ph=x.ph;save();beep()}}
},1000);
setInterval(function(){var f=document.activeElement&&document.activeElement.tagName;if(f==='INPUT'||f==='SELECT')return;if((tab==='heute'&&isToday())||(tab==='uni'&&S.timer))render()},60000);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
