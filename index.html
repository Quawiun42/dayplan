<style>

function pt(dateStr){
  var d=parse(dateStr), L=S.loc, M=METHODS[L.method]||METHODS.mwl, R=Math.PI/180;
  var tz=-new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTimezoneOffset()/60;
  var D=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12)/86400000+2440587.5-2451545.0;
  var fix=function(a,b){a=a%b;return a<0?a+b:a};
  var q=fix(357.529+0.98560028*D,360), mean=fix(280.459+0.98564736*D,360);
  var lon=fix(mean+1.915*Math.sin(q*R)+0.02*Math.sin(2*q*R),360), e=23.439-0.00000036*D;
  var ra=fix(Math.atan2(Math.cos(e*R)*Math.sin(lon*R),Math.cos(lon*R))/R/15,24);
  var eqt=fix(mean/15-ra+12,24)-12;
  var decl=Math.asin(Math.sin(e*R)*Math.sin(lon*R))/R;
  var noon=12+tz-L.lng/15-eqt;
  function ang(a,t,ccw){
    var v=(-Math.sin(a*R)-Math.sin(L.lat*R)*Math.sin(decl*R))/(Math.cos(L.lat*R)*Math.cos(decl*R));
    if(v>1||v<-1)return NaN;
    return t+(ccw?-1:1)*Math.acos(v)/R/15;
  }
  var rise=ang(0.833,noon,true), set=ang(0.833,noon,false);
  var night=fix(rise-set,24);
  var fajr=ang(M[1],noon,true), isha=ang(M[2],noon,false);
  var pf=M[1]/60*night, pi=M[2]/60*night;
  if(isNaN(fajr)||rise-fajr>pf)fajr=rise-pf;
  if(isNaN(isha)||isha-set>pi)isha=set+pi;
  var asr=ang(-Math.atan(1/(L.asr+Math.tan(Math.abs(L.lat-decl)*R)))/R,noon,false);
  var f=function(h){var m=Math.round(fix(h,24)*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
  return {fajr:f(fajr),sunrise:f(rise),dhuhr:f(noon+1/60),asr:f(asr),maghrib:f(set),isha:f(isha)};
}

  if(a==='next')return shift(1);
  if(a==='today'){date=ds(new Date());return render()}
  if(a==='pray')d.prayers[id]=!d.prayers[id];
  else if(a==='water')d.water=d.water===+id?+id-1:+id;
  else if(a==='delmeal')d.meals=d.meals.filter(function(m){return m.id!==id});
  else if(a==='recent'){var r=S.recent[+id];d.meals.push({id:uid(),n:r.n,k:r.k,p:r.p,time:nowHM()})}
  else if(a==='gymchk'){var ge=gymToday().ex.filter(function(e){return e.id===id})[0];d.gym[id]=!d.gym[id];if(ge){if(d.gym[id])d.gymlog[ge.n]={kg:ge.kg,s:ge.s,r:ge.r};else delete d.gymlog[ge.n]}}
  else if(a==='rest'){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}rest={end:Date.now()+(+id)*1000}}
  else if(a==='restoff')rest=null;
  else if(a==='delex')gymToday().ex=gymToday().ex.filter(function(e){return e.id!==id});
  else if(a==='task'){S.tasks.forEach(function(t){if(t.id===id)t.done=!t.done})}
  else if(a==='deltask')S.tasks=S.tasks.filter(function(t){return t.id!==id});
  else if(a==='delclass')S.classes=S.classes.filter(function(c){return c.id!==id});
  else if(a==='kzminus'&&S.kaza){S.kaza[id]=Math.max(0,(S.kaza[id]||0)-1)}
  else if(a==='kzplus'&&S.kaza){S.kaza[id]=(S.kaza[id]||0)+1;if(kzLeft()>S.kaza.init)S.kaza.init=kzLeft()}
  else if(a==='kzreset'){S.kaza=null}
  else if(a==='delpm')S.plan.meals=S.plan.meals.filter(function(m){return m.id!==id});
  else if(a==='startstudy'){if(!S.timer)S.timer={start:Date.now()};flash=''}
  else if(a==='stopstudy'&&S.timer){var ms=Date.now()-S.timer.start,lb=lvlOf(totalStudy()),mm=Math.max(1,Math.round(ms/60000));S.timer=null;
    if(ms>=30000){day(ds(new Date())).study.push({id:uid(),m:mm,n:''});var la=lvlOf(totalStudy());flash=la>lb?'Level '+la+' erreicht!':'Gut gemacht, +'+mm+' Min'}
    else flash='Zu kurz, mindestens 30 Sekunden zählen.'}
  else if(a==='study')d.study.push({id:uid(),m:+id,n:''});
  else if(a==='delstudy')d.study=d.study.filter(function(s){return s.id!==id});
  else if(a==='tas')d.tas++;
  else if(a==='tasreset')d.tas=0;
  else if(a==='recipemeal'){var rc=S.recipes.filter(function(r){return r.id===id})[0];if(rc){d.meals.push({id:uid(),n:rc.n,k:rc.k,p:rc.p||0,time:nowHM()});S.recent=[{n:rc.n,k:rc.k,p:rc.p||0}].concat(S.recent.filter(function(r){return r.n!==rc.n})).slice(0,6);rMsg='Zum Tag hinzugefügt: '+rc.n}}
  else if(a==='editrecipe'){rEdit=S.recipes.filter(function(r){return r.id===id})[0]||null;rMsg=''}
  else if(a==='canceledit')rEdit=null;
  else if(a==='delrecipe'){S.recipes=S.recipes.filter(function(r){return r.id!==id});if(rEdit&&rEdit.id===id)rEdit=null}
  else if(a==='scango'){var sn=document.getElementById('scn');analyze(sn?sn.value.trim():'')}
  else if(a==='scanreset')scan=null;
  else if(a==='keyreset'){S.apiKey='';scan=null}
  else if(a==='ics'){downloadIcs();nMsg='Kalender-Datei erstellt. Öffne sie und tippe auf „Alle hinzufügen“.'}
  else if(a==='notifon'){
    if(S.notif.on){S.notif.on=false;nMsg=''}
    else{Notification.requestPermission().then(function(r){S.notif.on=(r==='granted');nMsg=r==='granted'?'Eingeschaltet. Die App meldet sich zur Gebetszeit, solange sie aktiv ist.':'Erlaubnis nicht erteilt.';save();render()});return}
  }
  else if(a==='compass'){startCompass();return}
  else if(a==='uniics'){var un=uniIcs();uMsg=un?'Kalender-Datei erstellt ('+un+' Einträge).':'Es gibt noch nichts zum Erinnern.'}
  else if(a==='delgrade')S.grades=S.grades.filter(function(g){return g.id!==id});
  else if(a==='recipeshop'){var rr=S.recipes.filter(function(r){return r.id===id})[0],ad=0;if(rr)lines(rr.ing).forEach(function(t){if(!S.shop.some(function(x){return x.t.toLowerCase()===t.toLowerCase()&&!x.done})){S.shop.push({id:uid(),t:t,done:false});ad++}});rMsg=ad+' Zutaten auf der Einkaufsliste'}
  else if(a==='shopchk'){S.shop.forEach(function(x){if(x.id===id)x.done=!x.done})}
  else if(a==='delshop')S.shop=S.shop.filter(function(x){return x.id!==id});
  else if(a==='shopclear')S.shop=S.shop.filter(function(x){return !x.done});
  else if(a==='delweight')S.weights=S.weights.filter(function(x){return x.id!==id});
  else if(a==='range')rangeN=+id;
  else if(a==='ramadan')S.ramadan=!S.ramadan;
  else if(a==='export'){saveFile('dayplan-sicherung.json',exportText(),'application/json');bMsg='Datei erstellt. Falls nichts passiert, nutze „In die Zwischenablage kopieren“.'}
  else if(a==='copyexp'){var tx=exportText();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx).then(function(){bMsg='Kopiert. Füge es irgendwo ein, wo du es aufbewahrst (z. B. Notizen).';render()},function(){bMsg='Kopieren nicht möglich.';render()});else bMsg='Kopieren nicht möglich.'}
  else if(a==='pickpet'&&PETS[id])S.pet=id;
  else if(a==='changepet'&&!S.timer)S.pet=null;
  save();render();
  if(a==='editrecipe'&&rEdit){var rf=document.querySelector('[data-f=recipe]');if(rf)rf.scrollIntoView({block:'center'})}
});
document.addEventListener('change',function(ev){
  var el=ev.target,c=el.dataset.ch;if(!c)return;
  var L=S.loc;
  if(c==='city'){
    if(el.value==='_custom')L.city='Eigener Ort';
    else{L.city=el.value;L.lat=CITIES[el.value][0];L.lng=CITIES[el.value][1]}
  }
  else if(c==='exkg'){var xe=gymToday().ex.filter(function(e){return e.id===el.dataset.id})[0];if(xe){xe.kg=Math.max(0,+el.value||0);var dd=day();if(dd.gym[xe.id])dd.gymlog[xe.n]={kg:xe.kg,s:xe.s,r:xe.r}}}
  else if(c==='nbefore')S.notif.before=+el.value;
  else if(c==='method')L.method=el.value;
  else if(c==='asr')L.asr=+el.value;
  else if(c==='lat'||c==='lng'){var v=parseFloat(el.value);if(isNaN(v))return;L[c]=c==='lat'?Math.max(-65,Math.min(65,v)):Math.max(-180,Math.min(180,v))}
  save();render();
});
document.addEventListener('change',function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.scan||!el.files||!el.files[0])return;
  shrink(el.files[0],function(url){scan=url?{img:url,state:'idle',msg:'',res:null}:{img:'',state:'idle',msg:'Das Foto konnte nicht gelesen werden.'};render()});
});
document.addEventListener('change',function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.imp||!el.files||!el.files[0])return;
  var r=new FileReader();r.onload=function(){bMsg=importText(String(r.result));render()};r.readAsText(el.files[0]);
});
document.addEventListener('input',function(ev){
  var el=ev.target;if(!el.dataset||!el.dataset.rs)return;
  var q=el.value.trim().toLowerCase();
  document.querySelectorAll('.rc details[data-s]').forEach(function(d){d.hidden=!!q&&d.dataset.s.indexOf(q)<0});
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target,k=f.dataset.f;if(!k)return;
  var v=Object.fromEntries(new FormData(f)),d=day();
  if(k==='meal'){
    var m={id:uid(),n:v.n.trim(),k:+v.k||0,p:+v.p||0,time:v.time};
    d.meals.push(m);
    S.recent=[{n:m.n,k:m.k,p:m.p}].concat(S.recent.filter(function(r){return r.n!==m.n})).slice(0,6);
  }
  else if(k==='goals'){S.goals={kcal:+v.kcal||2000,protein:+v.protein||100,water:Math.min(14,Math.max(1,+v.water||8)),glass:Math.min(1000,Math.max(100,+v.glass||250)),study:+v.study||240}}
  else if(k==='kaza'){
    var days=Math.round((parse(v.to)-parse(v.from))/86400000)+1-(Math.max(0,+v.skip)||0);
    if(!(days>0))kzMsg='Der Zeitraum ergibt keine offenen Tage. Prüfe die Daten.';
    else{kzMsg='';var wOn=v.witr==='1';S.kaza={fajr:days,dhuhr:days,asr:days,maghrib:days,isha:days,witr:wOn?days:0,witrOn:wOn,init:days*(wOn?6:5),days:days}}
  }
  else if(k==='recipe'){
    var nr={id:v.id||uid(),n:v.n.trim(),min:Math.round(+v.min)||0,k:Math.round(+v.k)||0,p:Math.round(+v.p)||0,ing:v.ing.trim(),steps:v.steps.trim()};
    if(v.id)S.recipes=S.recipes.map(function(r){return r.id===v.id?nr:r});else S.recipes.unshift(nr);
    rEdit=null;rMsg=v.id?'Gespeichert: '+nr.n:''
  }
  else if(k==='grade'){S.grades.push({id:uid(),n:v.n.trim(),g:Math.min(5,Math.max(1,+v.g||1)),cr:Math.max(1,Math.round(+v.cr)||1)})}
  else if(k==='weight'){var wk=+v.kg;if(wk>0)S.weights.push({id:uid(),d:v.d,kg:Math.round(wk*10)/10})}
  else if(k==='shop'){S.shop.push({id:uid(),t:v.t.trim(),done:false})}
  else if(k==='import'){bMsg=importText(v.t)}
  else if(k==='apikey'){S.apiKey=v.key.trim()}
  else if(k==='scanmeal'){var sm={id:uid(),n:v.n.trim(),k:+v.k||0,p:+v.p||0,time:nowHM()};d.meals.push(sm);S.recent=[{n:sm.n,k:sm.k,p:sm.p}].concat(S.recent.filter(function(r){return r.n!==sm.n})).slice(0,6);scan=null}
  else if(k==='wake'){S.plan.wake=v.wake}
  else if(k==='pmeal'){S.plan.meals.push({id:uid(),n:v.n.trim(),t:v.t})}
  else if(k==='study'){if(+v.m>0)d.study.push({id:uid(),m:Math.round(+v.m),n:(v.n||'').trim()})}
  else if(k==='gymhead'){var g=gymToday();g.name=v.name.trim();g.time=v.time||g.time}
  else if(k==='ex'){gymToday().ex.push({id:uid(),n:v.n.trim(),s:+v.s,r:+v.r,kg:+v.kg||0})}
  else if(k==='task'){S.tasks.push({id:uid(),t:v.t.trim(),due:v.due||'',done:false})}
  else if(k==='class'){S.classes.push({id:uid(),n:v.n.trim(),d:+v.d,a:v.a,b:v.b,room:(v.room||'').trim()})}
  save();render();
});
render();
setInterval(notifTick,20000);notifTick();
setInterval(function(){if(!rest)return;var left=Math.ceil((rest.end-Date.now())/1000),el=document.getElementById('rt');if(left<=0){rest=null;beep();if(tab==='gym')render()}else if(el)el.textContent=fmtMS(left)},250);
document.addEventListener('visibilitychange',function(){if(!document.hidden)notifTick()});
setInterval(function(){var el=document.getElementById('tm');if(el&&S.timer)el.textContent=fmtClock(Date.now()-S.timer.start)},1000);
setInterval(function(){var f=document.activeElement&&document.activeElement.tagName;if(f==='INPUT'||f==='SELECT')return;if((tab==='heute'&&isToday())||(tab==='uni'&&S.timer))render()},60000);
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
